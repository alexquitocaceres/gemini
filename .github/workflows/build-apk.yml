name: Build Ruta 185 APK

on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ruta-185.zip if present
        run: |
          if [ -f ruta-185.zip ]; then
            unzip -o ruta-185.zip -d extracted_proj
            if [ -f extracted_proj/settings.gradle.kts ]; then
              cp -a extracted_proj/. .
            else
              SUBDIR=$(find extracted_proj -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -a "$SUBDIR"/. .
              fi
            fi
            rm -rf extracted_proj
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ruta 185 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruta185-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
